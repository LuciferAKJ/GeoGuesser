# ============================================================
# GeoGuesser - Production Profile (SPRING_PROFILES_ACTIVE=prod)
# Strictly requires environment variables. No development fallbacks.
# ============================================================

server.port=${PORT:8080}
spring.application.name=geoguesser

# -----------------------------
# Database (Strictly required in production)
# -----------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------
# Hibernate
# -----------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# -----------------------------
# JWT (Strictly required in production - minimum 256 bits)
# -----------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -----------------------------
# Mapbox (Strictly required in production)
# -----------------------------
mapbox.access-token=${MAPBOX_ACCESS_TOKEN}

# -----------------------------
# CORS (Strictly required for deployed frontend origin)
# -----------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# -----------------------------
# Logging
# -----------------------------
logging.level.com.geoguesser=INFO
logging.level.org.springframework.security=WARN
