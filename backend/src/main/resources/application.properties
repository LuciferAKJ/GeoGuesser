# ============================================================
# GeoGuesser - Default / Local Development Configuration
# Local private secrets can be placed in gitignored application-local.properties
# In production, run with SPRING_PROFILES_ACTIVE=prod
# ============================================================

server.port=${PORT:8080}
spring.application.name=geoguesser

# Optional local overrides (gitignored)
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

# -----------------------------
# Database
# -----------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/geoguesser}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------
# Hibernate
# -----------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------
# JWT (Local fallback: 256-bit dev key)
# -----------------------------
jwt.secret=${JWT_SECRET:dev_only_jwt_secret_key_minimum_256_bits_for_local_testing_geoguesser_application_security_token_secret}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -----------------------------
# Mapbox
# -----------------------------
mapbox.access-token=${MAPBOX_ACCESS_TOKEN:}

# -----------------------------
# CORS
# -----------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8081}

# -----------------------------
# Logging
# -----------------------------
logging.level.com.geoguesser=INFO
logging.level.org.springframework.security=WARN

# -----------------------------
# Email Verification & Resend
# -----------------------------
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:GeoGuesser <onboarding@resend.dev>}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5500}
app.email-verification-required=${EMAIL_VERIFICATION_REQUIRED:true}