# ============================================================
# GeoGuesser
# Default configuration
# ============================================================

server.port=8080
spring.application.name=geoguesser

# -----------------------------
# Database
# -----------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/geoguesser}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------
# Hibernate
# -----------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------
# JWT
# -----------------------------
jwt.secret=${JWT_SECRET:CHANGE_ME_FOR_LOCAL_DEVELOPMENT}
jwt.expiration-ms=86400000

# -----------------------------
# Mapbox
# -----------------------------
mapbox.access-token=${MAPBOX_ACCESS_TOKEN:}

# -----------------------------
# CORS
# -----------------------------
cors.allowed-origins=http://localhost:3000,http://localhost:8081

# -----------------------------
# Logging
# -----------------------------
logging.level.com.geoguesser=INFO
logging.level.org.springframework.security=WARN