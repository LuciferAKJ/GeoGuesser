# ============================================================
# GeoGuesser Backend Configuration
# Copy this file to application-local.properties and fill in
# your real values. Never commit secrets to git.
# ============================================================

# ---- Server ----
server.port=8080
spring.application.name=geoguesser

# ---- Database (PostgreSQL) ----
# Replace with your actual DB credentials
spring.datasource.url=jdbc:postgresql://localhost:5432/geoguesser
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
# Generate a strong secret: openssl rand -base64 64
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ---- Mapbox API ----
# Get your token at: https://account.mapbox.com/access-tokens/
mapbox.access-token=${MAPBOX_ACCESS_TOKEN}

# ---- CORS (allow JavaFX frontend) ----
cors.allowed-origins=http://localhost:3000,http://localhost:8081

# ---- Logging ----
logging.level.com.geoguesser=DEBUG
logging.level.org.springframework.security=WARN

