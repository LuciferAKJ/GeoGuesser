
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="globeGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5277"/>
      <stop offset="100%" stop-color="#e94560"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Globe Body -->
  <circle cx="32" cy="32" r="28" fill="url(#globeGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Latitude lines -->
  <ellipse cx="32" cy="32" rx="27" ry="14" fill="none" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="3,2"/>
  <ellipse cx="32" cy="32" rx="27" ry="24" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Longitude lines -->
  <ellipse cx="32" cy="32" rx="14" ry="27" fill="none" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.4"/>
  <line x1="32" y1="5" x2="32" y2="59" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="5" y1="32" x2="59" y2="32" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Marker Pin -->
  <g filter="url(#glow)">
    <path d="M32 12 C25 12 20 17 20 24 C20 32 32 46 32 46 C32 46 44 32 44 24 C44 17 39 12 32 12 Z" fill="url(#pinGrad)"/>
    <circle cx="32" cy="23" r="4.5" fill="#ffffff"/>
  </g>
</svg>
